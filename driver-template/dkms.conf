# dkms.conf — ทำให้โมดูล rebuild อัตโนมัติทุกครั้งที่เคอร์เนลอัปเดต
#
# ติดตั้งครั้งแรก (จากไดเรกทอรีแม่ของ driver-template/):
#   sudo cp -r driver-template /usr/src/duet5i_template-0.1
#   sudo dkms add -m duet5i_template -v 0.1
#   sudo dkms build -m duet5i_template -v 0.1
#   sudo dkms install -m duet5i_template -v 0.1
#
# หมายเหตุ: ชื่อโมดูล (duet5i_template) ต้องตรงกับชื่อไฟล์ .o ใน Makefile

PACKAGE_NAME="duet5i_template"
PACKAGE_VERSION="0.1"
BUILT_MODULE_NAME[0]="duet5i_template"
DEST_MODULE_LOCATION[0]="/updates"
AUTOINSTALL="yes"
MAKE[0]="make"
CLEAN="make clean"
